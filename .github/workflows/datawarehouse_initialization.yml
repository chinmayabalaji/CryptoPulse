name: initialize-redshift-data-warehouse

on:
    push:
        paths:
            - 'Datawarehouse_Initialization/**'
    workflow_dispatch:

defaults:
    run:
        working-directory: Datawarehouse_Initialization

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout Source
              uses: actions/checkout@v4

            - name: Configure AWS Credentials using OIDC
              uses: aws-actions/configure-aws-credentials@v4.1.0
              with:
                aws-region: eu-north-1
                role-to-assume: ${{ secrets.AWS_IAM_ROLE }}

            - name: Run Redshift Data Warehouse Initialization
              run: |
                aws redshift-data execute-statement \
                  --workgroup-name ${{ secrets.REDSHIFT_WORKGROUP_NAME }} \
                  --database ${{ secrets.REDSHIFT_DATABASE }} \
                  --secret-arn ${{ secrets.REDSHIFT_ADMIN_SECRET_ARN }} \
                  --sql "$(cat initial_setup.sql)"
              env:
                # ensure AWS region is set for the CLI
                AWS_REGION: eu-north-1

            - name: Verify Redshift tables
              run: |
                STATEMENT_ID=$(aws redshift-data execute-statement \
                  --workgroup-name "${{ secrets.REDSHIFT_WORKGROUP_NAME }}" \
                  --database "${{ secrets.REDSHIFT_DATABASE }}" \
                  --sql "select * from information_schema.tables" \
                  --query 'Id' \
                  --output text)

                aws redshift-data describe-statement \
                  --id "$STATEMENT_ID"

                aws redshift-data get-statement-result \
                  --id "$STATEMENT_ID"
              env:
                AWS_REGION: eu-north-1